<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 128" width="1200" height="128" role="img" aria-label="Built by kutluhangil">
<style>
:root{--ink:#24292f;--soft:#57606a}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--soft:#8b949e}}
.soft{fill:var(--soft)}
.line{stroke:var(--soft);stroke-opacity:.35}
.sig{fill:var(--ink);fill-opacity:0;stroke:var(--ink);stroke-width:.9;stroke-dasharray:620;stroke-dashoffset:620;animation:sig 14s ease-in-out infinite}
@keyframes sig{0%{stroke-dashoffset:620;fill-opacity:0;opacity:1}22%{stroke-dashoffset:0;fill-opacity:0}32%,90%{stroke-dashoffset:0;fill-opacity:1;opacity:1}97%{opacity:0;stroke-dashoffset:0;fill-opacity:1}100%{opacity:0;stroke-dashoffset:620;fill-opacity:0}}
.tick{animation:tick 14s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes tick{0%,24%{transform:scaleX(0)}34%,90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sig{stroke-dashoffset:0;fill-opacity:1}}
</style>
<text class="soft" x="600" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="4">DESIGNED · BUILT · SHIPPED BY</text>
<text class="sig" x="600" y="78" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="44">kutluhangil</text>
<line class="line" x1="510" y1="94" x2="690" y2="94"/>
<rect class="tick" x="510" y="93.5" width="28" height="1" fill="#4fc3ff"/>
<text class="soft" x="600" y="116" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="3">ISTANBUL · REBUILDREBREAK · 2026</text>
</svg>
